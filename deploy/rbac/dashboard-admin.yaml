# Optional login ServiceAccount for Kubernetes Dashboard (token auth).
# Apply after the upstream dashboard is installed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/part-of: kubernetes-dashboard-glass
    app.kubernetes.io/version: "1.2.0"
    dashboard.ocp/release: v1.2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin
  labels:
    app.kubernetes.io/part-of: kubernetes-dashboard-glass
    app.kubernetes.io/version: "1.2.0"
    dashboard.ocp/release: v1.2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: dashboard-admin
    namespace: kubernetes-dashboard
---
# Compatible with clusters that still expect a Secret-backed SA token
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-admin-token
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-admin
  labels:
    app.kubernetes.io/part-of: kubernetes-dashboard-glass
    app.kubernetes.io/version: "1.2.0"
    dashboard.ocp/release: v1.2
type: kubernetes.io/service-account-token
