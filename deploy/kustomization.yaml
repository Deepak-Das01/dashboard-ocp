# kube-dashboard — themed console packaging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubernetes-dashboard

configMapGenerator:
  - name: kube-dashboard-ui
    files:
      - kube-dashboard/theme.css
      - kube-dashboard/nav-accordion.js
  - name: kube-dashboard-nginx
    files:
      - kube-dashboard/nginx.conf

generatorOptions:
  disableNameSuffixHash: true

resources:
  - kube-dashboard/deployment.yaml
  - kube-dashboard/service.yaml
  - rbac/dashboard-admin.yaml
