# Glass overlay for official Kubernetes Dashboard
# Product: kubernetes-dashboard Glass UI v1 (1.0.0)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubernetes-dashboard

configMapGenerator:
  - name: dashboard-glass-css
    files:
      - glass/glass-theme.css
      - glass/nav-accordion.js
  - name: dashboard-glass-nginx
    files:
      - glass/nginx.conf

generatorOptions:
  disableNameSuffixHash: true

resources:
  - glass/deployment.yaml
  - glass/service.yaml
  - rbac/dashboard-admin.yaml
