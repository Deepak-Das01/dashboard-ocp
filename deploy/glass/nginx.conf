worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  sub_filter_once off;
  sub_filter_types text/html;

  upstream kd {
    server kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local:443;
  }

  server {
    listen 8080;
    server_name _;

    location = /glass-theme.css {
      alias /usr/share/nginx/html/glass-theme.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    location / {
      proxy_pass https://kd;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";

      sub_filter '</head>' '<link rel="stylesheet" href="/glass-theme.css"><style>html{color-scheme:dark}</style></head>';
      sub_filter '<body>' '<body class="kd-glass-theme">';
    }
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /glass-theme.css {
      alias /usr/share/nginx/html/glass-theme.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    location / {
      proxy_pass https://kd;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<link rel="stylesheet" href="/glass-theme.css"><style>html{color-scheme:dark}</style></head>';
      sub_filter '<body>' '<body class="kd-glass-theme">';
    }
  }
}
