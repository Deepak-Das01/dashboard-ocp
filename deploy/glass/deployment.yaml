# kubernetes-dashboard Glass UI — product version v1 (1.0.0)
# Proxies the official Kubernetes Dashboard and injects a macOS-style glass theme.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-glass
  namespace: kubernetes-dashboard
  labels:
    app: dashboard-glass
    app.kubernetes.io/name: dashboard-glass
    app.kubernetes.io/component: glass-ui
    app.kubernetes.io/part-of: kubernetes-dashboard-glass
    app.kubernetes.io/version: "1.0.0"
    dashboard.ocp/release: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-glass
  template:
    metadata:
      labels:
        app: dashboard-glass
        app.kubernetes.io/name: dashboard-glass
        app.kubernetes.io/version: "1.0.0"
        dashboard.ocp/release: v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: glass-css
              mountPath: /usr/share/nginx/html/glass-theme.css
              subPath: glass-theme.css
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: dashboard-glass-nginx
        - name: glass-css
          configMap:
            name: dashboard-glass-css
        - name: tls
          secret:
            secretName: dashboard-glass-tls
