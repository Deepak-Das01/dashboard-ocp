apiVersion: v1
kind: Service
metadata:
  name: kube-dashboard
  namespace: kubernetes-dashboard
  labels:
    app: kube-dashboard
    app.kubernetes.io/name: kube-dashboard
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/version: "1.2.2"
    dashboard.ocp/release: v1.2.2
spec:
  type: NodePort
  selector:
    app: kube-dashboard
  ports:
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
