worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  sub_filter_once off;
  sub_filter_types text/html;

  # Dashboard sidecar in the same pod (loopback)
  upstream kd {
    server 127.0.0.1:9090;
  }

  # HTTP NodePort (30080) → HTTPS NodePort (30443)
  server {
    listen 8080;
    server_name _;
    return 301 https://$host:30443$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /theme.css {
      alias /usr/share/nginx/html/theme.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    location = /nav-accordion.js {
      alias /usr/share/nginx/html/nav-accordion.js;
      default_type application/javascript;
      add_header Cache-Control "no-cache";
    }

    location / {
      proxy_pass http://kd;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";

      sub_filter '</head>' '<link rel="stylesheet" href="/theme.css?v=kube-dashboard-1.3.0"><style>html{color-scheme:dark}</style></head>';
      sub_filter '<body>' '<body class="kd-theme">';
      sub_filter '</body>' '<script src="/nav-accordion.js?v=kube-dashboard-1.3.0" defer></script></body>';
    }
  }
}
