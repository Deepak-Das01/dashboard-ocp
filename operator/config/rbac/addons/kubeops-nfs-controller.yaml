apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeops-nfs-controller
  namespace: kubeops-addon-controller
  labels:
    app.kubernetes.io/name: kubeops-nfs-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: nfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeops-nfs-controller
  labels:
    app.kubernetes.io/name: kubeops-nfs-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: nfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubeops-nfs-controller
    namespace: kubeops-addon-controller
