# Workload namespace for Rook operator + CephCluster + CSI + StorageClasses.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeops-ceph-cluster
  labels:
    app.kubernetes.io/name: kubeops-ceph-cluster
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: ceph
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Controller lives with other addon controllers (not in the workload ns).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeops-ceph-controller
  namespace: kubeops-addon-controller
  labels:
    app.kubernetes.io/name: kubeops-ceph-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: ceph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeops-ceph-controller
  labels:
    app.kubernetes.io/name: kubeops-ceph-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubeops-ceph-controller
    namespace: kubeops-addon-controller
