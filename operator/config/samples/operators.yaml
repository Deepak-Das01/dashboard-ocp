# Seed rows for: kubectl get operators / kubectl get ops
# Controllers overwrite status when CRs reconcile.
# Names always use kubeops-* ; role/component is console | oidc | nfs | virtualization | monitoring | ceph.
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-console
spec:
  component: console
  version: "1.3.0"
---
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-authentication
spec:
  component: oidc
  version: "1.3.0"
---
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-nfs
spec:
  component: nfs
  version: "1.3.0"
---
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-virtualization
spec:
  component: virtualization
  version: "1.3.0"
---
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-monitoring
spec:
  component: monitoring
  version: "1.3.0"
---
apiVersion: dashboard.ocp/v1alpha1
kind: Operator
metadata:
  name: kubeops-ceph
spec:
  component: ceph
  version: "1.3.0"
