# Console operator — dashboard + metrics + kubeadmin secret (NGINX basic auth)
apiVersion: dashboard.ocp/v1alpha1
kind: KubeDashboard
metadata:
  name: kube-dashboard
spec:
  namespace: kubeops-console
  version: "1.3.0"
  metricsServer:
    enabled: true
  service:
    httpsNodePort: 30443
    httpNodePort: 30080
  auth:
    mode: secret
    bootstrapAdmin:
      username: kubeadmin
      passwordLength: 16
