spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeops-authentication
  template:
    metadata:
      labels:
        app: kubeops-authentication
        app.kubernetes.io/name: kubeops-authentication
        app.kubernetes.io/part-of: kube-dashboard
        app.kubernetes.io/component: oidc
    spec:
      serviceAccountName: kubeops-authentication
      containers:
        - name: manager
          image: kubeops-authentication:1.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:18083
            - --metrics-bind-address=:18082
          ports:
            - name: health
              containerPort: 18083
            - name: metrics
              containerPort: 18082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
