apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-ceph-controller
  namespace: kubeops-addon-controller
  labels:
    app.kubernetes.io/name: kubeops-ceph-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeops-ceph-controller
  template:
    metadata:
      labels:
        app: kubeops-ceph-controller
        app.kubernetes.io/name: kubeops-ceph-controller
        app.kubernetes.io/part-of: kube-dashboard
        app.kubernetes.io/component: ceph
    spec:
      serviceAccountName: kubeops-ceph-controller
      containers:
        - name: manager
          image: kubeops-ceph:1.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:18087
            - --metrics-bind-address=:18086
          ports:
            - name: health
              containerPort: 18087
            - name: metrics
              containerPort: 18086
            - name: probe
              containerPort: 18088
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-ceph-controller
  namespace: kubeops-addon-controller
  labels:
    app.kubernetes.io/name: kubeops-ceph-controller
    app.kubernetes.io/part-of: kube-dashboard
    app.kubernetes.io/component: ceph
spec:
  selector:
    app: kubeops-ceph-controller
  ports:
    - name: probe
      port: 18088
      targetPort: probe
