apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: metallbs.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: MetalLB
    listKind: MetalLBList
    plural: metallbs
    singular: metallb
    shortNames: ["mlb"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pool
          type: string
          jsonPath: .status.poolName
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [addresses]
              properties:
                namespace:
                  type: string
                poolName:
                  type: string
                addresses:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                l2AdvertisementName:
                  type: string
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                namespace: { type: string }
                poolName: { type: string }
                addresses:
                  type: array
                  items: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
