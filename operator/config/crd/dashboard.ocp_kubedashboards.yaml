apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubedashboards.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: KubeDashboard
    listKind: KubeDashboardList
    plural: kubedashboards
    singular: kubedashboard
    shortNames: ["kd"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Auth
          type: string
          jsonPath: .status.auth.mode
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                namespace: { type: string }
                version: { type: string }
                service:
                  type: object
                  properties:
                    httpsNodePort: { type: integer }
                    httpNodePort: { type: integer }
                metricsServer:
                  type: object
                  properties:
                    enabled: { type: boolean }
                images:
                  type: object
                  properties:
                    proxy: { type: string }
                    dashboard: { type: string }
                    metricsScraper: { type: string }
                auth:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [secret, token, oidc]
                    bootstrapAdmin:
                      type: object
                      properties:
                        username: { type: string }
                        passwordLength: { type: integer, minimum: 8, maximum: 64 }
            status:
              type: object
              properties:
                phase: { type: string }
                url: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                auth:
                  type: object
                  properties:
                    mode: { type: string }
                    ready: { type: boolean }
                    bootstrapSecretRef: { type: string }
                    message: { type: string }
