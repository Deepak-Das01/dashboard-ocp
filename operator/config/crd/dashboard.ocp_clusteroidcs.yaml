apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusteroidcs.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: ClusterOIDC
    listKind: ClusterOIDCList
    plural: clusteroidcs
    singular: clusteroidc
    shortNames: ["coidc"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Issuer
          type: string
          jsonPath: .status.issuerURL
        - name: APIServer
          type: string
          jsonPath: .status.apiServerOIDC
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                namespace: { type: string }
                provider: { type: string }
                issuerURL: { type: string }
                clientID: { type: string }
                dexImage: { type: string }
                configureAPIServer: { type: boolean }
                bootstrapAdmin:
                  type: object
                  properties:
                    username: { type: string }
                    passwordLength: { type: integer, minimum: 8, maximum: 64 }
            status:
              type: object
              properties:
                phase: { type: string }
                issuerURL: { type: string }
                bootstrapSecretRef: { type: string }
                apiServerOIDC: { type: string }
                message: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
