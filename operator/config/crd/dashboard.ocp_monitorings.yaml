apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitorings.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: Monitoring
    listKind: MonitoringList
    plural: monitorings
    singular: monitoring
    shortNames: ["mon", "monitoring"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Grafana
          type: string
          jsonPath: .status.grafanaURL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                namespace: { type: string }
                storageClassName: { type: string }
                retention: { type: string }
                grafanaAdminUser: { type: string }
                grafanaAdminPassword: { type: string }
                enableAlertmanager: { type: boolean }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                namespace: { type: string }
                grafanaURL: { type: string }
                prometheusURL: { type: string }
                alertmanagerURL: { type: string }
                storageMode: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
