apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rookceps.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: RookCeph
    listKind: RookCephList
    plural: rookceps
    singular: rookceph
    shortNames: ["ceph", "rookceph"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.cephHealth
        - name: Dashboard
          type: string
          jsonPath: .status.dashboardURL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                namespace: { type: string }
                cephImage: { type: string }
                dataDirHostPath: { type: string }
                mon:
                  type: object
                  properties:
                    count: { type: integer }
                    allowMultiplePerNode: { type: boolean }
                mgr:
                  type: object
                  properties:
                    count: { type: integer }
                    allowMultiplePerNode: { type: boolean }
                nodeLabel:
                  type: object
                  properties:
                    key: { type: string }
                    value: { type: string }
                nodes:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      devices:
                        type: array
                        items: { type: string }
                enableDashboard: { type: boolean }
                enableToolbox: { type: boolean }
                setBlockDefaultStorageClass: { type: boolean }
                dashboardNodePort: { type: integer, format: int32 }
                poolSize: { type: integer }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                namespace: { type: string }
                cephHealth: { type: string }
                dashboardURL: { type: string }
                storageClasses:
                  type: array
                  items: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
