apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualizations.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: Virtualization
    listKind: VirtualizationList
    plural: virtualizations
    singular: virtualization
    shortNames: ["virt", "virtualization"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: KubeVirt
          type: string
          jsonPath: .status.kubevirtPhase
        - name: CDI
          type: string
          jsonPath: .status.cdiPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                kubevirtVersion: { type: string }
                cdiVersion: { type: string }
                useEmulation: { type: boolean }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                kubevirtPhase: { type: string }
                cdiPhase: { type: string }
                kubevirtVersion: { type: string }
                cdiVersion: { type: string }
                uiURL: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
