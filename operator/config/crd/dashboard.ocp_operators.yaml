apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operators.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: Operator
    listKind: OperatorList
    plural: operators
    singular: operator
    shortNames: ["ops"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Component
          type: string
          jsonPath: .spec.component
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [component]
              properties:
                component:
                  type: string
                  enum: [console, oidc, nfs, virtualization, monitoring]
                version:
                  type: string
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                url: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
