apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nfsprovisioners.dashboard.ocp
  labels:
    app.kubernetes.io/part-of: kube-dashboard
spec:
  group: dashboard.ocp
  names:
    kind: NFSProvisioner
    listKind: NFSProvisionerList
    plural: nfsprovisioners
    singular: nfsprovisioner
    shortNames: ["nfsprov"]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Server
          type: string
          jsonPath: .spec.server
        - name: StorageClass
          type: string
          jsonPath: .status.storageClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [server, path, storageClassName]
              properties:
                server:
                  type: string
                  minLength: 1
                path:
                  type: string
                  minLength: 1
                namespace:
                  type: string
                storageClassName:
                  type: string
                  minLength: 1
                defaultClass:
                  type: boolean
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                namespace: { type: string }
                storageClass: { type: string }
                observedGeneration: { type: integer, format: int64 }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                    required: [type, status]
